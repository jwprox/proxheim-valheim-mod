name: Build and release Proxheim

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: proxheim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Install SteamCMD dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 lib32stdc++6
      - name: Fetch dedicated-server reference assemblies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/steamcmd" "$RUNNER_TEMP/valheim"
          curl --fail --location --retry 3 \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o "$RUNNER_TEMP/steamcmd.tar.gz"
          tar -xzf "$RUNNER_TEMP/steamcmd.tar.gz" -C "$RUNNER_TEMP/steamcmd"
          # A fresh SteamCMD cache can report "Missing configuration" on its first
          # install. Refresh app info and retry the stable public branch explicitly.
          for attempt in 1 2 3; do
            if "$RUNNER_TEMP/steamcmd/steamcmd.sh" \
              +@sSteamCmdForcePlatformType linux \
              +force_install_dir "$RUNNER_TEMP/valheim" \
              +login anonymous +app_info_update 1 \
              +app_update 896660 -beta public validate +quit; then
              if test -f "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"; then
                break
              fi
            fi
            echo "SteamCMD attempt $attempt did not provide references; retrying..."
            sleep 5
          done
          test -f "$RUNNER_TEMP/valheim/valheim_server_Data/Managed/assembly_valheim.dll"
      - name: Fetch BepInEx build references
        shell: bash
        env:
          BEPINEX_PACK_VERSION: '5.4.2333'
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://thunderstore.io/package/download/denikson/BepInExPack_Valheim/$BEPINEX_PACK_VERSION/" \
            -o "$RUNNER_TEMP/bepinex.zip"
          unzip -q "$RUNNER_TEMP/bepinex.zip" -d "$RUNNER_TEMP/bepinex"
          test -f "$RUNNER_TEMP/bepinex/BepInExPack_Valheim/BepInEx/core/BepInEx.dll"
      - name: Build
        run: >-
          dotnet build src/Proxheim/Proxheim.csproj --configuration Release
          -p:ManagedPath="$RUNNER_TEMP/valheim/valheim_server_Data/Managed"
          -p:BepInExPath="$RUNNER_TEMP/bepinex/BepInExPack_Valheim/BepInEx"
      - name: Package and validate release version
        id: package
        shell: pwsh
        run: ./scripts/Package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Proxheim-${{ steps.package.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Proxheim-${{ needs.build.outputs.version }}
          path: dist
      - name: Create release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          assets=("dist/Proxheim-v$VERSION-Install.zip" "dist/Proxheim.dll" "dist/SHA256SUMS.txt")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # A re-run replaces this workflow's assets without rewriting edited notes.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            flags=()
            if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --title "Proxheim v$VERSION" --generate-notes \
              --notes-file dist/RELEASE_NOTES.md "${flags[@]}"
          fi

